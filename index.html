<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <input type="text" id="keybaord" readonly>
   <div class="general">
     <div class="upper">
        <button class="clock">🕑</button>
        <button class="ruler">📏</button>
        <button></button>
       <button id="backspace" >⌫</button>

    </div>
    <div >
         
    </div>
   </div>
    <div class="calculator">
        <button id="clear" style="color: rgb(232, 107, 107);">C</button>
        <button id="bracket" style="color: green;">()</button>
        <button id="percentage" style="color: green;">%</button>
        <button id="division" style="color: green;">÷</button>

        <button class="btn">7</button>
        <button class="btn">8</button>
        <button class="btn">9</button>
        <button id="multplication" style="color: green;">×</button>

        <button class="btn">4</button>
        <button class="btn">5</button>
        <button class="btn">6</button>
        <button id="subtraction" style="color: green;">-</button>

        <button  class="btn">1</button>
        <button  class="btn">2</button>
        <button  class="btn">3</button>
        <button id="addition" style="color: green;">+</button>

        <button class="addsub">+/-</button>
        <button  class="btn">0</button>
        <button  class="btn">.</button>
        <button id="equal" style="background-color: green; color: white;">=</button>

    </div>
    <script src="js/script.js"></script>
</body>
</html>
